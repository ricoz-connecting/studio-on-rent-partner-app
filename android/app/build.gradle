plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle plugin must come after Android & Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.bookmystudio.partner"

    // ✅ Use NDK 26+ — supports 16 KB page size
    ndkVersion "26.1.10909125"

    // ✅ Compile with latest stable SDK
    compileSdk 36

    defaultConfig {
        applicationId "com.bookmystudio.partner"
        minSdkVersion flutter.minSdkVersion                         // Flutter default minimum
        targetSdk 36                      // Matches Android 14
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            keyAlias 'upload'
            keyPassword '12345678'
            storeFile file('upload-keystore.jks')
            storePassword '12345678'
        }
        release {
            keyAlias 'upload'
            keyPassword '12345678'
            storeFile file('upload-keystore.jks')
            storePassword '12345678'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // set true later for size optimization
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // ✅ Enables modern builds for large page sizes
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
